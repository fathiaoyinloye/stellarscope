name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: stellarscope
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: --shm-size 1gb

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/stellarscope
      STELLAR_NETWORK: testnet
      STELLAR_SCOPE_LOG_LEVEL: INFO
      MONITORING_INTERVAL_SECONDS: 60
      WORKER_LEASE_TIMEOUT_MINUTES: 3
      OBSERVATION_DEADLINE_MINUTES: 60
      ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Wait for PostgreSQL readiness
        run: |
          until PGPASSWORD=postgres psql -U postgres -h localhost -d stellarscope -c 'SELECT 1' > /dev/null 2>&1; do
            sleep 2
          done

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Run backend tests
        run: |
          cd backend
          PYTHONPATH=src pytest tests/ -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/tests

      - name: Build frontend production assets
        run: |
          cd frontend
          npm run build