[alembic]
script_location = ./alembic
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/stellarscope

[loggers]
keys = root

[handlers]
keys = consoleHandler

[formatters]
keys = genericFormatter

[formatter_genericFormatter]
format = %(asctime)s %(levelname)s %(name)s %(message)s

[handler_consoleHandler]
class = StreamHandler
level = NOTSET
formatter = genericFormatter
args = (sys.stderr,)

[logger_root]
level = INFO
handlers = consoleHandler
