version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: stellarscope-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stellarscope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: stellarscope-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/stellarscope
      STELLAR_NETWORK: testnet
      STELLAR_SCOPE_LOG_LEVEL: INFO
      MONITORING_INTERVAL_SECONDS: 60
      WORKER_LEASE_TIMEOUT_MINUTES: 3
      OBSERVATION_DEADLINE_MINUTES: 60
      ENV: development
    ports:
      - "8000:8000"
    command: uvicorn src.stellarapi.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
