services:
  db:
    image: postgres:15-alpine
    container_name: stellarscope-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stellarscope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: stellarscope-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/stellarscope
      STELLAR_NETWORK: testnet
      STELLAR_SCOPE_LOG_LEVEL: INFO
      MONITORING_INTERVAL_SECONDS: 60
      WORKER_LEASE_TIMEOUT_MINUTES: 3
      OBSERVATION_DEADLINE_MINUTES: 60
      ENV: development
      CORS_ORIGINS: "http://localhost:5173 http://localhost:3000"
    ports:
      - "8000:8000"
    command: uvicorn stellarapi.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stellarscope-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      VITE_API_URL: "http://app:8000/api"
      PROXY_TARGET: "http://app:8000"
      CORS_ORIGINS: "http://localhost:8000"
    ports:
      - "5173:5173"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: stellarscope-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/stellarscope
      STELLAR_NETWORK: testnet
      STELLAR_SCOPE_LOG_LEVEL: INFO
      MONITORING_INTERVAL_SECONDS: 60
      WORKER_LEASE_TIMEOUT_MINUTES: 3
      OBSERVATION_DEADLINE_MINUTES: 60
      ENV: development
    command: python -m stellarapi.monitoring.worker

  discovery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: stellarscope-discovery-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/stellarscope
      STELLAR_NETWORK: testnet
      STELLAR_SCOPE_LOG_LEVEL: INFO
      DISCOVERY_INTERVAL_SECONDS: 300
      ENV: development
    command: python -m stellarapi.monitoring.discovery_worker

volumes:
  postgres_data: